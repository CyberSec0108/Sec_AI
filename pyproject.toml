[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secai-security-audit"
version = "0.1.0"
description = "Deterministic evidence-based Windows security audit core for Sec_AI"
readme = "README.md"
requires-python = "==3.14.*"
license = "LicenseRef-Proprietary"
authors = [{ name = "Sec_AI Project" }]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["security_audit*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["security_audit"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "apps", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "apps", "tests"]
cache_dir = "/tmp/secai-mypy-cache"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
